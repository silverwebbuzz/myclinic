<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sandbox shipping label</title>
<style>
  body { margin: 0; padding: 24px 16px; font-family: system-ui, sans-serif; background: #f8fafc; color: #0f172a; }
  .label { max-width: 380px; margin: 0 auto; border: 2px dashed #d97706; background: #fff; padding: 24px; text-align: center; }
  h1 { margin: 0 0 8px; font-size: 22px; color: #b45309; }
  p { margin: 8px 0 0; font-size: 14px; line-height: 1.5; }
</style>
</head>
<body>
<div class="label">
  <h1>SANDBOX LABEL</h1>
  <p>This shipment was booked in Shiprocket sandbox mode. No courier will collect it.</p>
  <p>Do not stick this on a real parcel.</p>
</div>
</body>
</html>
